<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LocalVault</title>
<meta name="description" content="Private PDF, image, text and utility tools. Processed 100% on your device. Works offline.">
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LocalVault">
<script>try{if(localStorage.getItem('lv-theme')==='dark')document.documentElement.classList.add('dark')}catch(e){}</script>
<style>
:root{--bg:#f6f8fb;--card:#fff;--text:#101828;--muted:#667085;--line:#e4e8ef;--accent:#3b82f6;--accent2:#2563eb;--soft:#eef4ff;--field:#fff;--okbg:#ecfdf3;--ok:#067647;--errbg:#fef3f2;--err:#b42318}
:root.dark{--bg:#0b1020;--card:#121a2e;--text:#eef2f9;--muted:#9aa7bd;--line:#223049;--soft:#16264a;--field:#0d1527;--okbg:#0b2a1b;--ok:#86efac;--errbg:#3b1210;--err:#fda29b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;letter-spacing:-.02em}
.hidden{display:none!important}
.grow{flex:1}
svg{flex-shrink:0}

/* layout */
.side{position:fixed;inset:0 auto 0 0;width:290px;background:var(--card);border-right:1px solid var(--line);z-index:50;display:flex;flex-direction:column;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top)}
.side.open{transform:none}
.overlay{position:fixed;inset:0;background:rgba(8,12,24,.5);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.on{opacity:1;pointer-events:auto}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);background:color-mix(in srgb,var(--card) 88%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-title{font-weight:800;letter-spacing:-.02em;font-size:17px}
.main{max-width:980px;margin:0 auto;padding:22px 16px calc(80px + env(safe-area-inset-bottom))}
@media(min-width:1024px){.side{transform:none}.shell{margin-left:290px}.overlay{display:none}#menu,.close-side{display:none}.top-title{visibility:hidden}}

/* sidebar */
.brand{display:flex;align-items:center;justify-content:space-between;padding:16px 16px 6px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.02em}
.logo i{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff}
.search{position:relative;padding:8px 16px}
.search svg{position:absolute;left:28px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
#nav{flex:1;overflow:auto;padding:4px 10px 16px}
.cat{font-size:12px;font-weight:600;color:var(--muted);padding:16px 10px 4px}
#nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;font-size:14px}
#nav a:hover{background:var(--soft)}
#nav a.on{background:var(--accent);color:#fff;font-weight:600}
.side-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);font-size:12px;color:var(--muted)}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:11px;padding:11px 18px;font-weight:600;font-size:14px;background:var(--accent);color:#fff;cursor:pointer;transition:transform .08s,background .15s}
.btn:hover{background:var(--accent2)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn.sec{background:var(--soft);color:var(--accent2)}
:root.dark .btn.sec{color:#9cc0ff}
.btn.sec:hover{filter:brightness(.96)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--soft)}
.btn.sm{padding:7px 12px;font-size:13px;border-radius:9px}
label.btn{cursor:pointer}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:10px;background:transparent;cursor:pointer}
.icon-btn:hover{background:var(--soft)}
.icon-btn:disabled{opacity:.3;pointer-events:none}
.f{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:var(--field);outline:none;transition:border-color .15s,box-shadow .15s}
.f:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.25)}
textarea.f{resize:vertical;line-height:1.5}
input[type=range]{width:100%;accent-color:var(--accent)}
input[type=color]{width:56px;height:44px;padding:2px;border:1px solid var(--line);border-radius:10px;background:var(--field);cursor:pointer}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack>*+*{margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:8px 13px;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.note{font-size:13px;color:var(--muted)}
.msg{padding:12px 14px;border-radius:10px;font-size:14px;word-break:break-word}
.msg.ok{background:var(--okbg);color:var(--ok)}
.msg.err{background:var(--errbg);color:var(--err)}
.priv{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ok);background:var(--okbg);padding:4px 11px;border-radius:99px}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}

/* dropzone */
.dz{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;padding:52px 20px;border:2px dashed #b9c6dc;border-radius:22px;background:var(--card);cursor:pointer;transition:.15s}
:root.dark .dz{border-color:#34476a}
.dz:hover,.dz.on{border-color:var(--accent);background:var(--soft)}
.dz svg{color:var(--accent);width:54px;height:54px;margin-bottom:4px}
.dz b{font-size:19px;letter-spacing:-.01em}
.dz span{font-size:14px;color:var(--muted)}
.dz.compact{padding:28px 16px}

/* progress */
.prog-top{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);margin-bottom:5px}
.prog-top span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}

/* file rows and results */
.list{display:grid;gap:8px}
.list:empty{display:none}
.item,.res{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.th{width:48px;height:48px;border-radius:9px;background:var(--soft);color:var(--accent);display:grid;place-items:center;overflow:hidden;flex-shrink:0}
.th img{width:100%;height:100%;object-fit:cover;transition:transform .2s}
.th.big{width:68px;height:68px}
.th.zoom{cursor:zoom-in}
.th.big img{object-fit:contain;background:#fff}
.meta{flex:1;min-width:0}
.meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}
.meta small{color:var(--muted);font-size:13px}
.acts{display:flex}
.acts .icon-btn{width:36px;height:36px}
.res-wrap{display:grid;gap:8px;padding:14px;border:1px solid var(--ok);border-radius:16px;background:var(--okbg)}
.res-head{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--ok);font-weight:600}
.lb{position:fixed;inset:0;z-index:100;background:rgba(8,12,24,.88);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.lb img{max-width:96vw;max-height:90vh;background:#fff;border-radius:8px}

/* pdf pages */
.pgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.pg{position:relative;display:flex;flex-direction:column;gap:4px;padding:6px;border:2px solid var(--line);border-radius:11px;background:var(--card);cursor:pointer;text-align:center;font-size:12px;color:var(--muted)}
.pg.sel{border-color:var(--accent);background:var(--soft)}
.pg.over{outline:2px dashed var(--accent)}
.imgbox{aspect-ratio:3/4;display:grid;place-items:center;overflow:hidden;background:#fff;border-radius:6px;color:#98a2b3;font-size:12px}
.imgbox img{max-width:100%;max-height:100%;transition:transform .2s}
.mini{display:flex;justify-content:center;gap:4px}
.mini button{border:0;background:var(--soft);color:var(--accent2);border-radius:7px;width:28px;height:26px;cursor:pointer;display:grid;place-items:center}

/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.stat b{display:block;font-size:26px;letter-spacing:-.02em;color:var(--accent2)}
:root.dark .stat b{color:#9cc0ff}
.stat span{font-size:13px;color:var(--muted)}

/* text tools */
.split{display:grid;gap:14px}
@media(min-width:800px){.split{grid-template-columns:1fr 1fr}}
.out-box{white-space:pre-wrap;word-break:break-word;font-size:14px;min-height:60px}
pre.code{margin:0;max-height:440px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.md{line-height:1.65;word-break:break-word}
.md h1,.md h2,.md h3,.md h4{margin:1.1em 0 .4em;line-height:1.25}
.md h1{font-size:1.7em}.md h2{font-size:1.4em}.md h3{font-size:1.15em}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table{margin:.6em 0}
.md code{background:var(--soft);padding:2px 6px;border-radius:6px;font:.9em ui-monospace,Menlo,Consolas,monospace}
.md pre{background:var(--soft);padding:12px;border-radius:10px;overflow:auto}
.md pre code{background:none;padding:0}
.md blockquote{border-left:4px solid var(--accent);margin-left:0;padding:2px 14px;color:var(--muted)}
.md table{border-collapse:collapse;display:block;overflow:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 10px}
.md img{max-width:100%}
.md hr{border:0;border-top:1px solid var(--line)}
.md a{color:var(--accent2);text-decoration:underline}
.md li.task{list-style:none;margin-left:-1.2em}

/* crop */
.stage{position:relative;display:inline-block;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none;line-height:0;overflow:hidden;border-radius:8px;background:#000}
.stage img{max-width:100%;max-height:62vh;display:block;pointer-events:none}
.cbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
.cbox i{position:absolute;width:30px;height:30px;background:rgba(59,130,246,.9);border:2px solid #fff;border-radius:8px}
.cbox i[data-h=nw]{left:0;top:0;cursor:nwse-resize}
.cbox i[data-h=ne]{right:0;top:0;cursor:nesw-resize}
.cbox i[data-h=sw]{left:0;bottom:0;cursor:nesw-resize}
.cbox i[data-h=se]{right:0;bottom:0;cursor:nwse-resize}

/* camera */
.cam{position:relative;border-radius:14px;overflow:hidden;background:#000;line-height:0}
.cam video{width:100%;max-height:60vh;object-fit:cover}
.aim{position:absolute;inset:18% 18%;border:3px solid rgba(255,255,255,.9);border-radius:18px;box-shadow:0 0 0 9999px rgba(0,0,0,.35)}

/* color */
.swatch{width:100%;height:120px;border-radius:14px;border:1px solid var(--line)}
.shades{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.shades button{height:44px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hist{display:flex;flex-wrap:wrap;gap:8px}
.hist button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);cursor:pointer}
.kv{display:flex;align-items:center;gap:10px}
.kv b{width:46px;font-size:13px;color:var(--muted)}
.kv code{flex:1;font:14px ui-monospace,Menlo,Consolas,monospace;word-break:break-all}
.pick-canvas{max-width:100%;border-radius:10px;cursor:crosshair;border:1px solid var(--line)}
.big-result{font-size:30px;font-weight:800;letter-spacing:-.02em;word-break:break-all;color:var(--accent2)}
:root.dark .big-result{color:#9cc0ff}
.utable{width:100%;border-collapse:collapse;font-size:14px}
.utable td{padding:8px 4px;border-bottom:1px solid var(--line)}
.utable td:last-child{text-align:right;font-variant-numeric:tabular-nums}

/* home */
.hero{padding:6px 0 22px}
.hero h1{font-size:clamp(30px,6vw,46px);font-weight:800;line-height:1.1;max-width:15em}
.hero p{margin:12px 0 18px;color:var(--muted);max-width:34em;font-size:16px}
.sugg{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.sugg a{display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border-radius:10px;background:var(--soft);color:var(--accent2);font-weight:600;font-size:14px}
:root.dark .sugg a{color:#9cc0ff}
.sugg-title{margin-top:16px;font-weight:700}
.index{margin-top:30px}
.index h2{font-size:18px;padding-bottom:8px;border-bottom:2px solid var(--text)}
.index a{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.index a:hover{background:var(--soft)}
.index .ti{flex-shrink:0;display:grid;place-items:center;width:38px;height:38px;border-radius:10px;background:var(--soft);color:var(--accent2)}
:root.dark .index .ti{color:#9cc0ff}
.index b{display:block}
.index span.d{font-size:14px;color:var(--muted)}
@media(min-width:760px){.index .list2{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}}
.facts{display:grid;gap:12px;margin-top:34px;padding:18px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.facts p{margin:0;font-size:14px;color:var(--muted)}
.facts b{color:var(--text)}

/* tool page */
.tool-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:20px}
.tool-head .ti{display:grid;place-items:center;width:50px;height:50px;border-radius:12px;background:var(--accent);color:#fff}
.tool-head h1{font-size:26px;font-weight:800}
.tool-head p{margin:2px 0 8px;color:var(--muted)}

/* toast */
#toasts{position:fixed;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:200;pointer-events:none}
.toast{pointer-events:auto;max-width:92vw;padding:11px 16px;border-radius:11px;background:#101828;color:#fff;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.25);transition:opacity .35s,transform .35s}
.toast.err{background:#b42318}
.toast.ok{background:#067647}
.toast.out{opacity:0;transform:translateY(8px)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<aside class="side" id="side">
  <div class="brand">
    <a href="#/" class="logo"><i id="logoIco"></i>LocalVault</a>
    <button class="icon-btn close-side" id="closeSide" aria-label="Close menu"></button>
  </div>
  <div class="search"><span id="searchIco"></span><input class="f" id="q" type="search" placeholder="Search tools" autocomplete="off"></div>
  <nav id="nav"></nav>
  <div class="side-foot">Your files never leave this device.</div>
</aside>
<div class="overlay" id="overlay"></div>
<div class="shell">
  <header class="top">
    <button class="icon-btn" id="menu" aria-label="Open menu"></button>
    <a class="top-title" href="#/">LocalVault</a>
    <span class="grow"></span>
    <span class="priv hidden" id="net">Offline mode</span>
    <button class="btn sm hidden" id="install">Install app</button>
    <button class="icon-btn" id="theme" aria-label="Toggle dark mode"></button>
  </header>
  <main class="main" id="main"></main>
</div>
<div id="toasts"></div>
<noscript><p style="padding:20px">LocalVault needs JavaScript to run.</p></noscript>
<script>
'use strict';
/* ===== PURE HELPERS (no DOM) ===== */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=b=>{if(!b)return '0 B';const u=['B','KB','MB','GB'];const i=Math.min(Math.floor(Math.log(b)/Math.log(1024)),3);return (b/Math.pow(1024,i)).toFixed(i?1:0)+' '+u[i]};
const noExt=n=>n.replace(/\.[^.]+$/,'');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const tick=()=>new Promise(r=>setTimeout(r,0));

/* page ranges */
function parseRanges(str,n){
  const out=[];
  const parts=String(str).split(',').map(s=>s.trim()).filter(Boolean);
  if(!parts.length)throw new Error('Enter page numbers, for example 1-3,5');
  for(const p of parts){
    const m=p.match(/^(\d+)(?:\s*-\s*(\d+))?$/);
    if(!m)throw new Error('"'+p+'" is not a valid page or range');
    let a=+m[1],b=m[2]?+m[2]:a;
    if(a<1||b<1||a>n||b>n)throw new Error('Pages must be between 1 and '+n);
    if(a>b){const t=a;a=b;b=t}
    for(let i=a;i<=b;i++)out.push(i-1);
  }
  return out;
}
function toRanges(idx){
  const s=[...new Set(idx)].sort((a,b)=>a-b),parts=[];
  for(let i=0;i<s.length;){let j=i;while(j+1<s.length&&s[j+1]===s[j]+1)j++;parts.push(j>i?(s[i]+1)+'-'+(s[j]+1):''+(s[i]+1));i=j+1}
  return parts.join(',');
}

/* text stats */
function textStats(text){
  const t=text.trim();
  const words=t?t.split(/\s+/).length:0;
  return{
    words,
    characters:text.length,
    noSpaces:text.replace(/\s/g,'').length,
    sentences:(text.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]).filter(x=>x.trim()).length,
    paragraphs:text.split(/\n\s*\n/).filter(p=>p.trim()).length,
    minutes:words?Math.max(1,Math.ceil(words/200)):0
  };
}

/* case converter */
const splitWords=s=>s.replace(/([a-z0-9])([A-Z])/g,'$1 $2').split(/[^A-Za-z0-9\u00C0-\u024F]+/).filter(Boolean);
const capW=w=>w.charAt(0).toUpperCase()+w.slice(1);
const CASES=[
  ['upper','UPPERCASE',s=>s.toUpperCase()],
  ['lower','lowercase',s=>s.toLowerCase()],
  ['title','Title Case',s=>s.toLowerCase().replace(/(^|\s)(\S)/g,(_,a,b)=>a+b.toUpperCase())],
  ['sentence','Sentence case',s=>s.toLowerCase().replace(/(^\s*|[.!?]\s+)(\p{L})/gu,(_,a,b)=>a+b.toUpperCase())],
  ['camel','camelCase',s=>splitWords(s).map((w,i)=>i?capW(w.toLowerCase()):w.toLowerCase()).join('')],
  ['pascal','PascalCase',s=>splitWords(s).map(w=>capW(w.toLowerCase())).join('')],
  ['snake','snake_case',s=>splitWords(s).map(w=>w.toLowerCase()).join('_')],
  ['kebab','kebab-case',s=>splitWords(s).map(w=>w.toLowerCase()).join('-')],
  ['constant','CONSTANT_CASE',s=>splitWords(s).map(w=>w.toUpperCase()).join('_')]
];

/* json */
function jsonError(e,src){
  const msg=e&&e.message?e.message:String(e);
  if(/line \d+ column \d+/i.test(msg))return msg;
  const m=/position (\d+)/.exec(msg);
  if(m){const pos=+m[1],before=src.slice(0,pos);return msg+' (line '+before.split('\n').length+', column '+(pos-before.lastIndexOf('\n'))+')'}
  return msg;
}
function sortKeys(v){
  if(Array.isArray(v))return v.map(sortKeys);
  if(v&&typeof v==='object'){const o={};Object.keys(v).sort().forEach(k=>{o[k]=sortKeys(v[k])});return o}
  return v;
}

/* markdown (own small parser, output is escaped) */
const safeUrl=u=>!/[\u0000-\u001f]/.test(u)&&(!/^[a-z][a-z0-9+.-]*:/i.test(u)||/^(https?:|mailto:)/i.test(u));
function mdInline(s){
  s=esc(s);
  const codes=[];
  s=s.replace(/`([^`]+)`/g,(_,c)=>{codes.push(c);return '\u0000'+(codes.length-1)+'\u0000'});
  s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;[^)]*?&quot;)?\)/g,(_,alt,url)=>safeUrl(url)?'<img src="'+url+'" alt="'+alt+'">':alt);

function mdToHtml(src){
  src=String(src).replace(/\u0000/g,'').replace(/\r\n?/g,'\n');

  let i=0;
  const isSep=l=>/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const cells=l=>l.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(c=>c.trim());
  const hrRe=/^\s*([-*_])(\s*\1){2,}\s*$/;
  while(i<lines.length){
    const line=lines[i];
    if(/^\s*$/.test(line)){i++;continue}
    let m;
    if((m=line.match(/^\s*(```|~~~)/))){
      const fence=m[1],buf=[];i++;
      while(i<lines.length&&!lines[i].trim().startsWith(fence)){buf.push(lines[i]);i++}
      i++;
      out.push('<pre><code>'+esc(buf.join('\n'))+'</code></pre>');continue;
    }
    if((m=line.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))){out.push('<h'+m[1].length+'>'+mdInline(m[2])+'</h'+m[1].length+'>');i++;continue}
    if(hrRe.test(line)){out.push('<hr>');i++;continue}
    if(/^\s*>/.test(line)){
      const buf=[];
      while(i<lines.length&&/^\s*>/.test(lines[i])){buf.push(lines[i].replace(/^\s*>\s?/,''));i++}
      out.push('<blockquote>'+mdToHtml(buf.join('\n'))+'</blockquote>');continue;
    }
    if(line.includes('|')&&i+1<lines.length&&isSep(lines[i+1])){
      const head=cells(line);i+=2;
      const rows=[];
      while(i<lines.length&&lines[i].includes('|')&&!/^\s*$/.test(lines[i])){rows.push(cells(lines[i]));i++}
      out.push('<table><thead><tr>'+head.map(c=>'<th>'+mdInline(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+mdInline(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>');
      continue;
    }
    if((m=line.match(/^\s*([-*+]|\d+[.)])\s+/))){
      const ordered=/\d/.test(m[1]);
      const re=ordered?/^\s*\d+[.)]\s+(.*)$/:/^\s*[-*+]\s+(.*)$/;
      const items=[];
      while(i<lines.length&&re.test(lines[i])&&!hrRe.test(lines[i])){items.push(lines[i].match(re)[1]);i++}
      const tag=ordered?'ol':'ul';
      out.push('<'+tag+'>'+items.map(t=>{
        const k=t.match(/^\[( |x|X)\]\s+(.*)$/);
        return k?'<li class="task"><input type="checkbox" disabled '+(k[1]!==' '?'checked':'')+'> '+mdInline(k[2])+'</li>':'<li>'+mdInline(t)+'</li>';
      }).join('')+'</'+tag+'>');
      continue;
    }
    const buf=[line];i++;
    while(i<lines.length&&!/^\s*$/.test(lines[i])&&!/^\s*(```|~~~|#{1,6}\s|>|([-*+]|\d+[.)])\s)/.test(lines[i])&&!hrRe.test(lines[i])){buf.push(lines[i]);i++}
    out.push('<p>'+mdInline(buf.join('\n')).replace(/ {2,}\n/g,'<br>').replace(/\n/g,' ')+'</p>');
  }
  return out.join('\n');
}

function dropzone({accept='',multiple=true,label='Drag and drop files here, or tap to choose',hint='',test=()=>true,onFiles,compact}){

  };
  inp.onchange=()=>{take(inp.files);inp.value=''};
  ['dragenter','dragover'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.add('on')}));
  ['dragleave','drop'].forEach(ev=>z.addEventListener(ev,e=>{e.preventDefault();z.classList.remove('on')}));

/* ===== libraries (loaded on demand from CDN, then cached by the service worker) ===== */
const LIBS={
  pdflib:{url:'https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js',ok:()=>window.PDFLib},
  pdfjs:{url:'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js',ok:()=>window.pdfjsLib},
  heic:{url:'https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js',ok:()=>window.heic2any},
  qrgen:{url:'https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js',ok:()=>window.qrcode},
  jsqr:{url:'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js',ok:()=>window.jsQR}
};
const PDFJS_WORKER='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const loadingLibs={};
function loadLib(k){
  if(LIBS[k].ok())return Promise.resolve();
  if(loadingLibs[k])return loadingLibs[k];
  loadingLibs[k]=new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src=LIBS[k].url;s.crossOrigin='anonymous';
    s.onload=()=>LIBS[k].ok()?res():(delete loadingLibs[k],rej(new Error('A required library did not start. Please reload.')));
    s.onerror=()=>{delete loadingLibs[k];rej(new Error('Could not load a required library. Connect to the internet once so it can be saved for offline use.'))};
    document.head.appendChild(s);
  });
  return loadingLibs[k];
}
let pdfWorkerReady=null;
async function needPdfjs(){
  await loadLib('pdfjs');
  if(!pdfWorkerReady){
    pdfWorkerReady=(async()=>{
      const r=await fetch(PDFJS_WORKER);
      if(!r.ok)throw new Error('PDF engine could not be loaded');
      const t=await r.text();
      pdfjsLib.GlobalWorkerOptions.workerSrc=URL.createObjectURL(new Blob([t],{type:'text/javascript'}));
    })();
    pdfWorkerReady.catch(()=>{pdfWorkerReady=null});
  }
  await pdfWorkerReady;
}

/* ===== PDF TOOLS ===== */
async function loadPdfDoc(file){
  await loadLib('pdflib');
  const bytes=await readBytes(file);
  const head=new TextDecoder('latin1').decode(bytes.subarray(0,1024));
  const bad=()=>new Error('Could not open "'+file.name+'". The file may be damaged.');
  if(!head.includes('%PDF-'))throw bad();
  let doc;
  try{doc=await PDFLib.PDFDocument.load(bytes)}
  catch(e){
    if(/encrypt/i.test(e.message||''))throw new Error('"'+file.name+'" is password-protected. Remove the password first.');
    throw bad();
  }
  let n=0;
  try{n=doc.getPageCount()}catch(e){n=0}
  if(n<1)throw bad();
  return doc;
}
async function pdfThumbs(file,{scale=0.35,max=300,onThumb}={}){
  await needPdfjs();
  const doc=await pdfjsLib.getDocument({data:await readBytes(file)}).promise;
  const n=doc.numPages,thumbs=[];
  for(let i=1;i<=Math.min(n,max);i++){
    const p=await doc.getPage(i),vp=p.getViewport({scale});
    const c=document.createElement('canvas');c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const url=c.toDataURL('image/jpeg',0.7);
    thumbs.push(url);
    if(onThumb)onThumb(i-1,url);
    p.cleanup();c.width=c.height=0;
  }
  doc.destroy();
  return{count:n,thumbs};
}
async function firstThumb(blob){try{return (await pdfThumbs(blob,{max:1,scale:0.6})).thumbs[0]}catch(e){return null}}
async function extractPages(src,idx){
  const out=await PDFLib.PDFDocument.create();
  const pgs=await out.copyPages(src,idx);
  pgs.forEach(p=>out.addPage(p));
  return new Blob([await out.save()],{type:'application/pdf'});
}

/* ---- Compress ---- */
function toolPdfCompress(root){
  let files=[];
  root.innerHTML='<div class="stack"><div data-s="dz"></div><div class="list" data-s="list"></div>'+
    '<div class="card stack"><div><span class="lbl">Compression level</span><div data-s="lvl"></div></div><div class="note" data-s="desc"></div></div>'+
    '<div class="row"><button class="btn" data-s="go" disabled>Compress</button><button class="btn sec" data-s="clr">Clear</button></div><div data-s="prog"></div><div data-s="out"></div></div>';
  const P=progress();S_(root,'prog').append(P.el);
  const go=S_(root,'go');
  const desc={
    light:'Keeps text selectable and sharp. Savings are usually small.',
    balanced:'Turns pages into images at about 110 dpi. Good for scans and sharing. Text is no longer selectable.',
    strong:'Turns pages into images at about 72 dpi for the smallest size. Text is no longer selectable.'
  };
  const lvl=seg([['light','Light'],['balanced','Balanced'],['strong','Strong']],'balanced',v=>{S_(root,'desc').textContent=desc[v]});
  S_(root,'lvl').append(lvl.el);S_(root,'desc').textContent=desc.balanced;
  function sync(){
    renderRows(S_(root,'list'),files,{onRemove:i=>{files.splice(i,1);sync()}});
    go.disabled=!files.length;
    go.textContent=files.length>1?'Compress '+files.length+' PDFs':'Compress';
  }
  S_(root,'dz').append(dropzone({accept:'application/pdf,.pdf',test:isPdf,label:'Drag and drop PDFs here, or tap to choose',hint:'Batch supported',onFiles:f=>{files.push(...f);sync()}}));
  S_(root,'clr').onclick=()=>{files=[];S_(root,'out').innerHTML='';sync()};

  async function compressOne(file,level,onFrac){
    if(level==='light'){
      const d=await loadPdfDoc(file);
      return new Blob([await d.save({useObjectStreams:true})],{type:'application/pdf'});
    }
    await needPdfjs();await loadLib('pdflib');
    const doc=await pdfjsLib.getDocument({data:await readBytes(file)}).promise;
    const out=await PDFLib.PDFDocument.create();
    const[scale,q]=level==='balanced'?[1.5,0.72]:[1,0.55];
    for(let p=1;p<=doc.numPages;p++){
      const page=await doc.getPage(p),base=page.getViewport({scale:1});
      let s=scale;if(base.width*base.height*s*s>12e6)s=Math.sqrt(12e6/(base.width*base.height));
      const vp=page.getViewport({scale:s}),c=document.createElement('canvas');
      c.width=Math.ceil(vp.width);c.height=Math.ceil(vp.height);
      await page.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
      const blob=await toBlob(c,'image/jpeg',q);
      const jpg=await out.embedJpg(new Uint8Array(await blob.arrayBuffer()));
      const pg=out.addPage([base.width,base.height]);
      pg.drawImage(jpg,{x:0,y:0,width:base.width,height:base.height});
      page.cleanup();c.width=c.height=0;
      onFrac(p/doc.numPages);await tick();
    }
    doc.destroy();
    return new Blob([await out.save()],{type:'application/pdf'});
  }

  go.onclick=()=>task(go,P,async()=>{
    const level=lvl.get(),items=[];
    for(let i=0;i<files.length;i++){
      const f=files[i];

/* ===== IMAGE TOOLS ===== */
const MIME={png:'image/png',jpeg:'image/jpeg',webp:'image/webp'};
const EXT={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'};
const sameType=f=>f.type==='image/png'?'image/png':f.type==='image/webp'?'image/webp':'image/jpeg';

async function toBlobSafe(file){
  if(!isHeic(file))return file;
  await loadLib('heic');
  try{
    const out=await heic2any({blob:file,toType:'image/jpeg',quality:0.92});
    return Array.isArray(out)?out[0]:out;
  }catch(e){
    if(/already browser readable/i.test((e&&e.message)||''))return file;
    throw new Error('Could not read "'+file.name+'". The HEIC file may be damaged.');
  }
}
async function loadImg(file){
  const blob=await toBlobSafe(file),url=URL.createObjectURL(blob),img=new Image();
  img.src=url;
  try{await img.decode()}catch(e){URL.revokeObjectURL(url);throw new Error('Could not read "'+file.name+'" as an image.')}
  img.dataset.url=url;
  return img;
}
const freeImg=img=>{try{URL.revokeObjectURL(img.dataset.url)}catch(e){}};
function drawTo(img,w,h,bg){
  let W=Math.max(1,Math.round(w)),H=Math.max(1,Math.round(h));
  const cap=16e6;
  if(W*H>cap){const r=Math.sqrt(cap/(W*H));W=Math.max(1,Math.floor(W*r));H=Math.max(1,Math.floor(H*r))}
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const x=c.getContext('2d');x.imageSmoothingQuality='high';
  if(bg){x.fillStyle=bg;x.fillRect(0,0,W,H)}
  x.drawImage(img,0,0,W,H);
  return c;
}
function toBlob(c,type,q){return new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error('Could not create the image')),type,q))}
const bgFor=type=>type==='image/jpeg'?'#ffffff':null;
async function encodeTarget(img,w,h,type,targetBytes){
  let scale=1;
  for(let a=0;a<8;a++){
    const c=drawTo(img,w*scale,h*scale,bgFor(type));
    if(type==='image/png'){const b=await toBlob(c,type);if(b.size<=targetBytes||a===7)return b;scale*=0.8;continue}
    let lo=0.1,hi=0.95,best=null;
    for(let i=0;i<7;i++){const mid=(lo+hi)/2,b=await toBlob(c,type,mid);if(b.size<=targetBytes){best=b;lo=mid}else hi=mid}
    if(best)return best;
    scale*=0.8;
  }
  return toBlob(drawTo(img,w*scale,h*scale,bgFor(type)),type,0.1);
}
const fmtNote=(blob,type,extra)=>{
  const bits=[];
  if(blob.type&&blob.type!==type)bits.push('your browser saved this as '+(EXT[blob.type]||blob.type).toUpperCase()+' instead');
  return (extra?extra+', ':'')+fmt(blob.size)+(bits.length?' ('+bits.join('')+')':'');
};

/* ---- Compress ---- */
function toolImgCompress(root){
  imageBatch(root,{
    label:'Compress',zip:'compressed-images.zip',
    opts(){
      const e=el('<div class="card stack"><div><span class="lbl">Mode</span><div data-s="mode"></div></div>'+
        '<div data-s="qbox"><label class="lbl">Quality: <b data-s="qv">75</b>%</label><input type="range" min="10" max="100" value="75" data-s="q"></div>'+
        '<div data-s="tbox" class="hidden"><label class="lbl">Target size (KB)</label><input class="f" type="number" min="10" value="200" data-s="kb"></div>'+
        '<div class="grid2"><div><label class="lbl">Max width or height in px (optional)</label><input class="f" type="number" min="100" placeholder="Keep original" data-s="max"></div><div><span class="lbl">Output format</span><div data-s="fmt"></div></div></div>'+
        '<div class="note">PNG files cannot be compressed by quality. Choose JPEG or WebP for the biggest savings.</div></div>');
      const mode=seg([['q','Quality'],['t','Target size']],'q',v=>{S_(e,'qbox').classList.toggle('hidden',v!=='q');S_(e,'tbox').classList.toggle('hidden',v!=='t')});
      S_(e,'mode').append(mode.el);
      const f=seg([['same','Same as original'],['jpeg','JPEG'],['webp','WebP']],'same');S_(e,'fmt').append(f.el);
      S_(e,'q').oninput=ev=>{S_(e,'qv').textContent=ev.target.value};
      return{el:e,get:()=>({mode:mode.get(),q:+S_(e,'q').value/100,kb:+S_(e,'kb').value||200,max:+S_(e,'max').value||0,fmt:f.get()})};
    },
    async run(file,s){
      const img=await loadImg(file);
      try{
        let w=img.naturalWidth,h=img.naturalHeight,resized=false;
        if(s.max&&Math.max(w,h)>s.max){const r=s.max/Math.max(w,h);w*=r;h*=r;resized=true}
        const type=s.fmt==='same'?sameType(file):MIME[s.fmt];
        const blob=s.mode==='t'?await encodeTarget(img,w,h,type,s.kb*1024):await toBlob(drawTo(img,w,h,bgFor(type)),type,s.q);
        const changedType=type!==file.type;
        if(blob.size>=file.size&&!resized&&!changedType&&!isHeic(file))return{name:file.name,blob:file,note:'Already small. Original kept ('+fmt(file.size)+')'};
        const ext=EXT[blob.type]||EXT[type];
        return{name:noExt(file.name)+'-compressed.'+ext,blob,note:fmt(file.size)+' to '+fmt(blob.size)+(blob.size<file.size?' (saved '+Math.round((1-blob.size/file.size)*100)+'%)':'')};
      }finally{freeImg(img)}
    }
  });
}

      const mode=seg([['px','Pixels'],['pct','Percent']],'px',v=>{S_(e,'pxbox').classList.toggle('hidden',v!=='px');S_(e,'pctbox').classList.toggle('hidden',v!=='pct')});

function toolImgCrop(root){
  let im=null,url=null,fileName='image',srcType='image/jpeg',W=0,H=0,ratio=0,drag=null;
  const crop={x:0,y:0,w:0,h:0};
  root.innerHTML='<div class="stack"><div data-s="dz"></div><div data-s="work" class="hidden stack">'+
    '<div><span class="lbl">Shape</span><div data-s="ratio"></div></div>'+
    '<div><div class="stage" data-s="stage"><img data-s="im" alt=""><div class="cbox" data-s="box"><i data-h="nw"></i><i data-h="ne"></i><i data-h="sw"></i><i data-h="se"></i></div></div></div>'+
    '<div class="note" data-s="info">Drag the box to move it. Drag a blue corner to resize.</div>'+
    '<div class="grid2"><div><span class="lbl">Output format</span><div data-s="fmt"></div></div><div><label class="lbl">Quality: <b data-s="qv">92</b>%</label><input type="range" min="40" max="100" value="92" data-s="q"></div></div>'+
    '<div class="row"><button class="btn" data-s="go">Crop and save</button><button class="btn sec" data-s="new">Choose another image</button></div><div data-s="out"></div></div></div>';
  const stage=S_(root,'stage'),box=S_(root,'box'),img=S_(root,'im'),info=S_(root,'info');
  const ratios=[['0','Free'],['1','1:1'],['1.3333','4:3'],['1.7778','16:9'],['0.75','3:4'],['0.5625','9:16']];
  const rSeg=seg(ratios,'0',v=>{ratio=+v;if(ratio)fitRatio();paint()});
  S_(root,'ratio').append(rSeg.el);
  const fSeg=seg([['same','Same as original'],['jpeg','JPEG'],['png','PNG'],['webp','WebP']],'same');
  S_(root,'fmt').append(fSeg.el);
  S_(root,'q').oninput=e=>{S_(root,'qv').textContent=e.target.value};

  function paint(){
    box.style.left=crop.x+'px';box.style.top=crop.y+'px';box.style.width=crop.w+'px';box.style.height=crop.h+'px';
    const sc=im?im.naturalWidth/W:1;
    info.textContent='Output size: '+Math.round(crop.w*sc)+' x '+Math.round(crop.h*sc)+' px. Drag the box to move it, drag a blue corner to resize.';
  }
  function fitRatio(){
    let w=W*0.85,h=w/ratio;
    if(h>H*0.85){h=H*0.85;w=h*ratio}
    crop.w=w;crop.h=h;crop.x=(W-w)/2;crop.y=(H-h)/2;
  }
  function initCrop(){
    W=img.clientWidth;H=img.clientHeight;
    if(ratio)fitRatio();else{crop.w=W*0.85;crop.h=H*0.85;crop.x=(W-crop.w)/2;crop.y=(H-crop.h)/2}
    paint();
  }
  function resizeFrom(ax,ay,px,py){
    px=clamp(px,0,W);py=clamp(py,0,H);
    let w=Math.abs(px-ax),h=Math.abs(py-ay);
    const sx=px<ax?-1:1,sy=py<ay?-1:1;
    if(ratio){
      if(w/ratio>h)h=w/ratio;else w=h*ratio;
      const mw=sx<0?ax:W-ax,mh=sy<0?ay:H-ay;
      if(w>mw){w=mw;h=w/ratio}
      if(h>mh){h=mh;w=h*ratio}
    }
    w=Math.max(w,24);h=ratio?w/ratio:Math.max(h,24);
    crop.x=sx<0?ax-w:ax;crop.y=sy<0?ay-h:ay;crop.w=w;crop.h=h;
    crop.x=clamp(crop.x,0,Math.max(0,W-crop.w));crop.y=clamp(crop.y,0,Math.max(0,H-crop.h));
  }
  stage.addEventListener('pointerdown',e=>{
    const h=e.target.dataset&&e.target.dataset.h;
    if(!h&&e.target!==box)return;
    e.preventDefault();
    try{stage.setPointerCapture(e.pointerId)}catch(_){}
    const r=stage.getBoundingClientRect();
    drag={h,sx:e.clientX,sy:e.clientY,c:{x:crop.x,y:crop.y,w:crop.w,h:crop.h},r};
    if(h){drag.ax=h.includes('w')?crop.x+crop.w:crop.x;drag.ay=h.includes('n')?crop.y+crop.h:crop.y}
  });
  stage.addEventListener('pointermove',e=>{
    if(!drag)return;
    if(drag.h)resizeFrom(drag.ax,drag.ay,e.clientX-drag.r.left,e.clientY-drag.r.top);
    else{crop.x=clamp(drag.c.x+e.clientX-drag.sx,0,W-crop.w);crop.y=clamp(drag.c.y+e.clientY-drag.sy,0,H-crop.h)}
    paint();
  });
  ['pointerup','pointercancel'].forEach(t=>stage.addEventListener(t,()=>{drag=null}));
  const onResize=()=>{if(im&&W){const k=img.clientWidth/W;crop.x*=k;crop.y*=k;crop.w*=k;crop.h*=k;W=img.clientWidth;H=img.clientHeight;paint()}};
  window.addEventListener('resize',onResize);

  async function open(f){
    try{
      fileName=f.name;srcType=sameType(f);
      const blob=await toBlobSafe(f);
      if(url)URL.revokeObjectURL(url);
      url=URL.createObjectURL(blob);
      img.src=url;await img.decode();im=img;
      S_(root,'dz').classList.add('hidden');S_(root,'work').classList.remove('hidden');
      S_(root,'out').innerHTML='';
      initCrop();
    }catch(e){toast(e.message||'Could not open this image','err')}
  }
  S_(root,'dz').append(dropzone({accept:'image/*,.heic,.heif',multiple:false,test:isImg,label:'Drag and drop an image here, or tap to choose',hint:'One image at a time',onFiles:f=>open(f[0])}));
  S_(root,'new').onclick=()=>{S_(root,'work').classList.add('hidden');S_(root,'dz').classList.remove('hidden');S_(root,'out').innerHTML=''};
  S_(root,'go').onclick=async()=>{
    try{
      const sc=img.naturalWidth/W,sx=crop.x*sc,sy=crop.y*sc,sw=crop.w*sc,sh=crop.h*sc;
      const type=fSeg.get()==='same'?srcType:MIME[fSeg.get()];
      const c=document.createElement('canvas');c.width=Math.max(1,Math.round(sw));c.height=Math.max(1,Math.round(sh));
      const x=c.getContext('2d');
      if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
      x.drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);
      const b=await toBlob(c,type,+S_(root,'q').value/100);
      showResults(S_(root,'out'),[{name:noExt(fileName)+'-crop.'+(EXT[b.type]||EXT[type]),blob:b,thumb:URL.createObjectURL(b),note:c.width+'x'+c.height+' px, '+fmt(b.size)}]);
    }catch(e){toast(e.message||'Could not crop','err')}
  };
  return()=>{window.removeEventListener('resize',onResize);if(url)URL.revokeObjectURL(url)};
}

/* ---- Rotate ---- */
function toolImgRotate(root){
  let files=[],rot=0,fh=false,fv=false;
  root.innerHTML='<div class="stack"><div data-s="dz"></div><div class="list" data-s="list"></div>'+
    '<div class="card stack"><div class="row"><button class="btn sec" data-s="l">'+ico('rotateL',18)+' Left</button><button class="btn sec" data-s="r">'+ico('rotate',18)+' Right</button><button class="btn sec" data-s="fh">Flip horizontal</button><button class="btn sec" data-s="fv">Flip vertical</button><button class="btn ghost" data-s="reset">Reset</button></div><div class="note" data-s="state">No change yet.</div></div>'+
    '<div class="row"><button class="btn" data-s="go" disabled>Apply</button><button class="btn sec" data-s="clr">Clear</button></div><div data-s="prog"></div><div data-s="out"></div></div>';
  const P=progress();S_(root,'prog').append(P.el);
  const go=S_(root,'go');
  const css=()=>'transform:rotate('+rot+'deg) scale('+(fh?-1:1)+','+(fv?-1:1)+')'+';';
  function sync(){
    renderRows(S_(root,'list'),files,{thumb:true,tf:css(),onRemove:i=>{files.splice(i,1);sync()}});
    go.disabled=!files.length;
    go.textContent=files.length>1?'Apply to '+files.length+' images':'Apply';
    const bits=[];if(rot)bits.push('rotate '+rot+' deg');if(fh)bits.push('flip horizontal');if(fv)bits.push('flip vertical');
    S_(root,'state').textContent=bits.length?'Will apply: '+bits.join(', ')+'.':'No change yet.';
  }
  S_(root,'l').onclick=()=>{rot=(rot+270)%360;sync()};
  S_(root,'r').onclick=()=>{rot=(rot+90)%360;sync()};
  S_(root,'fh').onclick=()=>{fh=!fh;sync()};
  S_(root,'fv').onclick=()=>{fv=!fv;sync()};
  S_(root,'reset').onclick=()=>{rot=0;fh=false;fv=false;sync()};
  S_(root,'dz').append(dropzone({accept:'image/*,.heic,.heif',test:isImg,label:'Drag and drop images here, or tap to choose',hint:'Batch supported',onFiles:f=>{files.push(...f);sync()}}));
  S_(root,'clr').onclick=()=>{files=[];S_(root,'out').innerHTML='';sync()};
  go.onclick=()=>task(go,P,async()=>{
    if(!rot&&!fh&&!fv){toast('Choose a rotation or flip first','err');return}
    const res=[];
    for(let i=0;i<files.length;i++){
      P.set(i/files.length*100,(i+1)+' of '+files.length+': '+files[i].name);await tick();
      try{
        const img=await loadImg(files[i]);
        try{
          const swap=rot%180!==0,w=img.naturalWidth,h=img.naturalHeight;
          let cw=swap?h:w,ch=swap?w:h;
          if(cw*ch>16e6){const k=Math.sqrt(16e6/(cw*ch));cw=Math.floor(cw*k);ch=Math.floor(ch*k)}
          const dw=swap?ch:cw,dh=swap?cw:ch;
          const type=sameType(files[i]);
          const c=document.createElement('canvas');c.width=cw;c.height=ch;
          const x=c.getContext('2d');
          if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,cw,ch)}
          x.translate(cw/2,ch/2);x.rotate(rot*Math.PI/180);x.scale(fh?-1:1,fv?-1:1);
          x.drawImage(img,-dw/2,-dh/2,dw,dh);
          const blob=await toBlob(c,type,0.92);
          res.push({name:noExt(files[i].name)+'-rotated.'+(EXT[blob.type]||EXT[type]),blob,thumb:URL.createObjectURL(blob),note:cw+'x'+ch+' px, '+fmt(blob.size)});
        }finally{freeImg(img)}
      }catch(e){toast(e.message,'err')}
    }
    P.set(100,'Done');setTimeout(()=>P.hide(),700);
    showResults(S_(root,'out'),res,'rotated-images.zip');
  },sync);
  sync();
}

function qrEscape(s){return String(s).replace(/([\\;,:"])/g,'\\$1')}
async function makeQR(text,ec){
  await loadLib('qrgen');
  qrcode.stringToBytes=s=>Array.from(new TextEncoder().encode(s));
  const q=qrcode(0,ec);q.addData(text);q.make();
  return q;
}
function drawQR(q,size,margin,fg,bg){
  const n=q.getModuleCount(),total=n+margin*2,cell=Math.max(1,Math.floor(size/total)),px=cell*total;
  const c=document.createElement('canvas');c.width=c.height=px;
  const x=c.getContext('2d');x.fillStyle=bg;x.fillRect(0,0,px,px);x.fillStyle=fg;
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))x.fillRect((k+margin)*cell,(r+margin)*cell,cell,cell);
  return c;
}
function qrSvg(q,margin,fg,bg){
  const n=q.getModuleCount(),t=n+margin*2;let d='';
  for(let r=0;r<n;r++)for(let k=0;k<n;k++)if(q.isDark(r,k))d+='M'+(k+margin)+' '+(r+margin)+'h1v1h-1z';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 '+t+' '+t+'" shape-rendering="crispEdges"><rect width="'+t+'" height="'+t+'" fill="'+bg+'"/><path d="'+d+'" fill="'+fg+'"/></svg>';
}

function toolQRScan(root){
  root.innerHTML='<div class="stack"><div class="card stack"><div class="cam hidden" data-s="cam"><video playsinline muted data-s="v"></video><div class="aim"></div></div><div class="row"><button class="btn" data-s="start">'+ico('camera',18)+' Start camera</button><button class="btn sec hidden" data-s="stop">Stop camera</button><label class="btn sec">'+ico('image',18)+' Scan from image<input type="file" accept="image/*" hidden data-s="file"></label></div><div class="note" data-s="st">Point the camera at a QR code. Camera access needs your permission.</div></div><div data-s="res" class="stack"></div></div>';
  const video=S_(root,'v'),cam=S_(root,'cam'),st=S_(root,'st'),res=S_(root,'res');
  let stream=null,raf=0,last=0,canvas=document.createElement('canvas'),active=false;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});
  function found(text){
    stop();
    const isUrl=/^https?:\/\//i.test(text);
    const card=el('<div class="card stack"><b>QR code found</b><div class="out-box"></div><div class="row"><button class="btn sec" data-s="cp">'+ico('copy',16)+' Copy</button>'+(isUrl?'<a class="btn" target="_blank" rel="noopener noreferrer">Open link</a>':'')+'</div></div>');
    $('.out-box',card).textContent=text;
    if(isUrl)$('a',card).href=text;
    $('[data-s=cp]',card).onclick=()=>copy(text);
    res.prepend(card);
    if(navigator.vibrate)try{navigator.vibrate(60)}catch(e){}
    st.textContent='Done. Tap Start camera to scan another one.';
  }
  function scanData(img,w,h){return jsQR(img.data,w,h,{inversionAttempts:'attemptBoth'})}
  function loop(t){
    if(!active)return;
    raf=requestAnimationFrame(loop);
    if(t-last<130||video.readyState<2||!video.videoWidth)return;
    last=t;
    const k=Math.min(1,640/video.videoWidth),w=Math.round(video.videoWidth*k),h=Math.round(video.videoHeight*k);
    canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);
    const code=scanData(ctx.getImageData(0,0,w,h),w,h);
    if(code&&code.data)found(code.data);
  }
  function stop(){
    active=false;cancelAnimationFrame(raf);
    if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
    video.srcObject=null;cam.classList.add('hidden');
    S_(root,'stop').classList.add('hidden');S_(root,'start').classList.remove('hidden');
  }
  S_(root,'start').onclick=async()=>{
    try{
      await loadLib('jsqr');
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia)throw new Error('This browser cannot open the camera here. Use Scan from image instead.');
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      video.srcObject=stream;await video.play();
      cam.classList.remove('hidden');S_(root,'stop').classList.remove('hidden');S_(root,'start').classList.add('hidden');
      st.textContent='Scanning. Hold the code inside the frame.';
      active=true;raf=requestAnimationFrame(loop);
    }catch(e){
      stop();
      const denied=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');
      st.textContent=denied?'Camera permission was blocked. Allow the camera for this site in your browser settings, or use Scan from image.':(e.message||'Could not start the camera.');
    }
  };
  S_(root,'stop').onclick=()=>{stop();st.textContent='Camera stopped.'};
  S_(root,'file').onchange=async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{
      await loadLib('jsqr');
      const img=await loadImg(f);
      try{
        const k=Math.min(1,1600/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
        canvas.width=w;canvas.height=h;ctx.drawImage(img,0,0,w,h);
        const code=scanData(ctx.getImageData(0,0,w,h),w,h);
        if(code&&code.data)found(code.data);else toast('No QR code found in this image','err');
      }finally{freeImg(img)}
    }catch(err){toast(err.message||'Could not read this image','err')}
  };
  return stop;
}

function toolColor(root){
  let hist=[];
  try{hist=JSON.parse(localStorage.getItem('lv-colors')||'[]')}catch(e){}
  root.innerHTML='<div class="split"><div class="stack"><div class="swatch" data-s="sw"></div>'+
    '<div class="row"><input type="color" data-s="pk" value="#3b82f6" aria-label="Pick a color"><input class="f" data-s="hex" value="#3b82f6" maxlength="7" style="max-width:150px" aria-label="Hex value">'+
    '<button class="btn sec hidden" data-s="eye">Pick from screen</button></div>'+
    '<div class="card stack"><div class="kv"><b>HEX</b><code data-s="o-hex"></code><button class="icon-btn" data-c="o-hex" aria-label="Copy HEX">'+ico('copy',18)+'</button></div><div class="kv"><b>RGB</b><code data-s="o-rgb"></code><button class="icon-btn" data-c="o-rgb" aria-label="Copy RGB">'+ico('copy',18)+'</button></div><div class="kv"><b>HSL</b><code data-s="o-hsl"></code><button class="icon-btn" data-c="o-hsl" aria-label="Copy HSL">'+ico('copy',18)+'</button></div></div>'+
    '<div class="note" data-s="ctr"></div></div>'+
    '<div class="stack"><div><span class="lbl">Shades (tap to copy)</span><div class="shades" data-s="shades"></div></div>'+
    '<div><span class="lbl">Pick a color from a photo</span><div data-s="dz"></div><div data-s="cv" style="margin-top:10px"></div></div>'+
    '<div><span class="lbl">Recent colors</span><div class="hist" data-s="hist"></div></div></div></div>';
  let cur='#3b82f6';
  const set=(hex,remember)=>{
    const rgb=hex2rgb(hex);if(!rgb)return;
    cur=rgb2hex(...rgb);
    const[h,s,l]=rgb2hsl(...rgb);
    S_(root,'sw').style.background=cur;S_(root,'pk').value=cur;S_(root,'hex').value=cur;
    S_(root,'o-hex').textContent=cur.toUpperCase();
    S_(root,'o-rgb').textContent='rgb('+rgb.join(', ')+')';
    S_(root,'o-hsl').textContent='hsl('+h+', '+s+'%, '+l+'%)';
    const cw=contrast(rgb,[255,255,255]),cb=contrast(rgb,[0,0,0]);
    const lab=r=>r>=7?'passes AAA':r>=4.5?'passes AA':r>=3?'large text only':'fails';
    S_(root,'ctr').textContent='White text on this color: '+cw.toFixed(1)+':1 ('+lab(cw)+'). Black text: '+cb.toFixed(1)+':1 ('+lab(cb)+').';
    S_(root,'shades').innerHTML=[95,85,75,65,55,45,35,25,15].map(L=>{const c=rgb2hex(...hsl2rgb(h,s,L));return '<button style="background:'+c+'" data-c2="'+c+'" aria-label="'+c+'"></button>'}).join('');
    if(remember){hist=[cur,...hist.filter(c=>c!==cur)].slice(0,12);try{localStorage.setItem('lv-colors',JSON.stringify(hist))}catch(e){}drawHist()}
  };
  const drawHist=()=>{S_(root,'hist').innerHTML=hist.length?hist.map(c=>'<button style="background:'+c+'" data-c2="'+c+'" aria-label="'+c+'"></button>').join(''):'<span class="note">Colors you pick show up here.</span>'};
  S_(root,'pk').oninput=e=>set(e.target.value,false);
  S_(root,'pk').onchange=e=>set(e.target.value,true);
  S_(root,'hex').oninput=e=>{let v=e.target.value.trim();if(v&&v[0]!=='#')v='#'+v;if(hex2rgb(v))set(v,false)};
  S_(root,'hex').onchange=()=>set(S_(root,'hex').value.trim()[0]==='#'?S_(root,'hex').value:'#'+S_(root,'hex').value,true);
  root.addEventListener('click',e=>{
    const c=e.target.closest('[data-c]');if(c){copy(S_(root,c.dataset.c).textContent);return}
    const c2=e.target.closest('[data-c2]');if(c2){set(c2.dataset.c2,true);copy(c2.dataset.c2)}
  });
  if(window.EyeDropper){
    const b=S_(root,'eye');b.classList.remove('hidden');
    b.onclick=async()=>{try{const r=await new EyeDropper().open();set(r.sRGBHex,true)}catch(e){}};
  }
  S_(root,'dz').append(dropzone({accept:'image/*,.heic,.heif',multiple:false,test:isImg,compact:true,label:'Choose a photo',hint:'Then tap anywhere on it',onFiles:async f=>{
    try{
      const img=await loadImg(f[0]);
      const k=Math.min(1,1200/Math.max(img.naturalWidth,img.naturalHeight)),w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;c.className='pick-canvas';
      const x=c.getContext('2d',{willReadFrequently:true});x.drawImage(img,0,0,w,h);freeImg(img);
      const pick=e=>{const r=c.getBoundingClientRect();const px=clamp(Math.floor((e.clientX-r.left)*w/r.width),0,w-1),py=clamp(Math.floor((e.clientY-r.top)*h/r.height),0,h-1);const d=x.getImageData(px,py,1,1).data;set(rgb2hex(d[0],d[1],d[2]),true)};
      c.addEventListener('click',pick);
      S_(root,'cv').innerHTML='';S_(root,'cv').append(c);
    }catch(e){toast(e.message,'err')}
  }}));
  set(cur,false);drawHist();
}

function toolUnits(root){
  root.innerHTML='<div class="stack"><div><span class="lbl">Type</span><div data-s="cat"></div></div><div class="card stack"><div class="grid2"><div><label class="lbl">Value</label><input class="f" type="number" step="any" value="1" data-s="val" inputmode="decimal"></div><div><label class="lbl">From</label><select class="f" data-s="from"></select></div><div><label class="lbl">To</label><select class="f" data-s="to"></select></div></div><div class="row"><button class="btn sec" data-s="swap">'+ico('convert',16)+' Swap units</button></div><div class="big-result" data-s="res"></div></div><div class="card"><span class="lbl">The same value in every unit</span><table class="utable" data-s="all"></table></div></div>';
  let cat='Length';
  const from=S_(root,'from'),to=S_(root,'to'),val=S_(root,'val');
  function fill(){
    const names=Object.keys(UNITS[cat]);
    const opt=names.map(n=>'<option value="'+esc(n)+'">'+esc(n)+'</option>').join('');
    from.innerHTML=opt;to.innerHTML=opt;
    from.value=names[0];to.value=names[1]||names[0];
    calc();
  }
  function calc(){
    const v=parseFloat(val.value);
    if(!isFinite(v)){S_(root,'res').textContent='Enter a number';S_(root,'all').innerHTML='';return}
    S_(root,'res').textContent=numFmt(v)+' '+from.value+' = '+numFmt(convertUnit(cat,v,from.value,to.value))+' '+to.value;
    S_(root,'all').innerHTML=Object.keys(UNITS[cat]).map(n=>'<tr><td>'+esc(n)+'</td><td>'+numFmt(convertUnit(cat,v,from.value,n))+'</td></tr>').join('');
  }
  S_(root,'cat').append(seg(Object.keys(UNITS).map(k=>[k,k]),'Length',v=>{cat=v;fill()}).el);
  val.oninput=calc;from.onchange=calc;to.onchange=calc;
  S_(root,'swap').onclick=()=>{const a=from.value;from.value=to.value;to.value=a;calc()};
  fill();
}
